plugins { id 'com.android.application' }

android {
    namespace 'br.com.corridaeaventura.coletorzebra'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.corridaeaventura.coletorzebra'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.webkit:webkit:1.12.1'
}
